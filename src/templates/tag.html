$partial("templates/nav.html")$

$partial("templates/particles.html")$

<main class="flex-1" id="content" tabindex="-1">
  <section class="page pt-12 sm:pt-16">
    <a
      href="/#posts"
      class="font-mono text-xs text-[var(--faint)] hover:text-[var(--accent)] transition-colors"
      >← cd ~/posts</a
    >
    <h1 class="mt-5 mb-10 text-[2rem] font-semibold tracking-[-0.025em] leading-tight">$title$</h1>
    <ul class="m-0 p-0 list-none" role="list">
      $for(posts)$
      <li>
        <a
          href="$url$"
          class="group grid grid-cols-[5.5rem_1fr] sm:grid-cols-[6.5rem_1fr_auto] gap-x-4 items-baseline -mx-3 px-3 py-2.5 rounded-lg hover:bg-[var(--surface)] transition-colors"
        >
          <time datetime="$isodate$" class="font-mono text-xs text-[var(--faint)] tabular-nums">$isodate$</time>
          <span class="text-[var(--fg)] text-pretty group-hover:text-[var(--accent)] transition-colors">$title$</span>
          <span class="hidden sm:inline font-mono text-xs text-[var(--faint)]">$readingtime$</span>
        </a>
      </li>
      $endfor$
    </ul>
  </section>
</main>

$partial("templates/footer.html")$
