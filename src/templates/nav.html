<a
  class="absolute left-[-10000px] focus:left-4 focus:top-4 z-50 px-3 py-1 rounded bg-[var(--accent)] text-[var(--bg)] font-mono text-sm"
  href="#content"
  >Skip to content</a
>
<nav
  class="sticky top-0 z-40 border-b border-[var(--border)] bg-[color-mix(in_srgb,var(--bg)_82%,transparent)] backdrop-blur-md"
>
  <div
    class="page h-14 flex items-center justify-between gap-4 font-mono text-[13px]"
  >
    <a href="/" class="group flex items-center gap-2 text-[var(--fg)]">
      <span class="text-[var(--accent)] text-base leading-none">λ</span>
      <span>flaviocorpa<span class="text-[var(--faint)] group-hover:text-[var(--accent)] transition-colors">.com</span></span>
    </a>
    <div class="flex items-center gap-4 sm:gap-5 text-[var(--muted)]">
      <a class="hover:text-[var(--fg)] transition-colors" href="/#posts">posts</a>
      <a class="hidden sm:inline hover:text-[var(--fg)] transition-colors" href="/#talks">talks</a>
      <a class="hover:text-[var(--fg)] transition-colors" href="/atom.xml">rss</a>
      <a
        class="hidden sm:inline hover:text-[var(--fg)] transition-colors"
        href="https://github.com/sponsors/kutyel"
        >sponsor</a
      >
      <button
        aria-label="Switch to light mode"
        aria-checked="true"
        data-theme-switch
        role="switch"
        type="button"
        class="grid place-items-center w-8 h-8 -mr-1.5 rounded-md text-[var(--muted)] hover:text-[var(--fg)] hover:bg-[var(--surface)] transition-colors cursor-pointer"
      >
        <svg data-theme-switch-icon="dark" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg data-theme-switch-icon="light" aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</nav>
