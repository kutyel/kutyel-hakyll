    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @custom-variant dark (&:where(.dark, .dark *));

      @theme {
        --font-sans: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        --font-mono: 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
      }

      /* ---------------------------------------------------------------
         Design tokens. The old variable names at the bottom of each block
         are kept because <bsky-comments> and older posts read them.
         --------------------------------------------------------------- */
      body.light {
        --bg: #fafaf8;
        --surface: #f1f1ed;
        --fg: #1b1e23;
        --muted: #636b78;
        --faint: #a0a6b0;
        --border: #e4e4df;
        --accent: #7c3aed;
        --accent-soft: rgba(124, 58, 237, 0.08);
        --code-bg: #0f131a;
        --inline-code-bg: rgba(124, 58, 237, 0.08);
        --selection: rgba(124, 58, 237, 0.18);
      }
      body.dark {
        --bg: #0c0f14;
        --surface: #141820;
        --fg: #e4e7ed;
        --muted: #8a92a0;
        --faint: #565e6c;
        --border: #20262f;
        --accent: #c693ea;
        --accent-soft: rgba(198, 147, 234, 0.09);
        --code-bg: #0f131a;
        --inline-code-bg: rgba(198, 147, 234, 0.1);
        --selection: rgba(198, 147, 234, 0.25);
      }
      body.light,
      body.dark {
        --bgColor: var(--bg);
        --textColor: var(--fg);
        --textLinkColor: var(--accent);
        --textLinkHoverColor: var(--fg);
        --separatorColor: var(--border);
        --btnBgColor: var(--surface);
        --deepBgColor: var(--code-bg);
        --authorTitleColor: var(--muted);
      }

      /* ---------------------------------------------------------------
         Base
         --------------------------------------------------------------- */
      :root {
        color-scheme: light dark;
      }
      html {
        box-sizing: border-box;
        -webkit-text-size-adjust: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: inherit;
      }
      body {
        margin: 0;
        font-family: var(--font-sans);
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        transition: background-color 0.2s ease, color 0.2s ease;
      }
      ::selection {
        background: var(--selection);
      }
      input,
      button {
        font: inherit;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
        border-radius: 2px;
      }
      img {
        display: block;
        height: auto;
        max-width: 100%;
        margin-left: auto;
        margin-right: auto;
        border: 0;
      }

      /* Theme switch icon visibility rules */
      [data-theme-switch][aria-checked='true'] [data-theme-switch-icon='dark'],
      [data-theme-switch][aria-checked='false'] [data-theme-switch-icon='light'] {
        display: block;
      }
      [data-theme-switch][aria-checked='true'] [data-theme-switch-icon='light'],
      [data-theme-switch][aria-checked='false'] [data-theme-switch-icon='dark'] {
        display: none;
      }

      /* Tags rendered by Hakyll come as "a, b, c": drop the commas. */
      .tag-list {
        font-size: 0;
      }
      .tag-list a {
        display: inline-block;
        margin: 0 0.4rem 0.4rem 0;
        padding: 0.1rem 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.75rem;
        line-height: 1.5;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        transition: color 0.15s, border-color 0.15s;
      }
      .tag-list a::before {
        content: '#';
        color: var(--faint);
      }
      .tag-list a:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      /* ---------------------------------------------------------------
         Long-form content (post bodies)
         --------------------------------------------------------------- */
      .prose {
        font-size: 1.0625rem;
        line-height: 1.75;
      }
      .prose p {
        margin: 0;
      }
      .prose p + p {
        margin-top: 1.4em;
      }
      .prose a[href] {
        color: var(--accent);
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
        text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
        word-wrap: break-word;
        transition: text-decoration-color 0.15s;
      }
      .prose a[href]:hover {
        text-decoration-color: var(--accent);
      }
      .prose a[href].footnote-ref,
      .prose a[href].footnote-back {
        text-decoration: none;
      }
      .prose h2,
      .prose h3,
      .prose h4 {
        font-weight: 600;
        line-height: 1.25;
        letter-spacing: -0.015em;
        margin: 2.2em 0 0.7em;
        scroll-margin-top: 5rem;
      }
      .prose h2 {
        font-size: 1.5rem;
      }
      .prose h3 {
        font-size: 1.2rem;
      }
      .prose h2::before,
      .prose h3::before {
        font-family: var(--font-mono);
        font-weight: 400;
        color: var(--faint);
        margin-right: 0.5ch;
      }
      .prose h2::before {
        content: '##';
      }
      .prose h3::before {
        content: '###';
      }
      .prose hr {
        height: 0;
        border: none;
        border-top: 1px dashed var(--border);
        margin: 2.5em 0;
      }
      .prose blockquote {
        margin: 1.5em 0;
        padding: 0.25em 0 0.25em 1.1em;
        border-left: 2px solid var(--accent);
        color: var(--muted);
      }
      .prose blockquote em {
        font-size: 1.15em;
      }
      .prose ul,
      .prose ol {
        margin: 1em 0;
        padding-left: 1.5em;
      }
      .prose ul {
        list-style: disc outside;
      }
      .prose ol {
        list-style: decimal outside;
      }
      .prose li {
        margin: 0.3em 0;
      }
      .prose li::marker {
        color: var(--faint);
      }
      .prose li > ul,
      .prose li > ol {
        margin: 0.4em 0;
      }
      .prose img {
        border-radius: 10px;
        margin-top: 1.75em;
        margin-bottom: 1.75em;
      }
      .prose table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.92em;
        margin: 1.5em 0;
      }
      .prose th,
      .prose td {
        text-align: left;
        padding: 0.45em 0.75em;
        border-bottom: 1px solid var(--border);
      }
      .prose th {
        font-weight: 600;
      }
      .prose .footnotes {
        margin-top: 3em;
        font-size: 0.9em;
        color: var(--muted);
      }

      /* Code */
      code,
      kbd,
      pre,
      samp {
        font-family: var(--font-mono);
        font-size: 0.88em;
        font-feature-settings: normal;
      }
      pre code {
        font-size: inherit;
        line-height: 1.6;
      }
      .sourceCode:not(pre):not(code) {
        position: relative;
        background-color: var(--code-bg);
        border: 1px solid var(--border);
        overflow: hidden;
        margin: 1.5rem 0;
        border-radius: 10px;
      }
      pre.sourceCode {
        width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        padding: 1.1rem 1.25rem;
        margin: 0;
        color: #e4e7ed;
        background: none;
        font-size: 0.82rem;
        line-height: 1.6;
      }
      pre.numberSource.sourceCode > code {
        counter-reset: source-line 0;
      }
      pre.numberSource.sourceCode > code > span {
        counter-increment: source-line;
      }
      code.sourceCode > a.sourceLine:before {
        display: inline-block;
        content: attr(title);
        text-align: right;
        border-right: 1px solid rgba(128, 147, 147, 0.4);
        color: rgb(128, 147, 147);
        width: 30px;
        padding-right: 10px;
        margin-right: 10px;
      }
      [data-copy] {
        position: absolute;
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.15rem 0.5rem;
        font-family: var(--font-mono);
        font-size: 0.7rem;
        color: #8a92a0;
        background: #1a1f29;
        border: 1px solid #2a313d;
        border-radius: 6px;
        opacity: 0;
        cursor: pointer;
        transition: opacity 0.15s, color 0.15s;
      }
      .sourceCode:hover [data-copy],
      [data-copy]:focus-visible {
        opacity: 1;
      }
      [data-copy]:hover {
        color: #e4e7ed;
      }
      @media (max-width: 667px) {
        .sourceCode:not(pre):not(code) {
          border-radius: 0;
          border-left: 0;
          border-right: 0;
          margin-left: -1rem;
          margin-right: -1rem;
        }
        code.sourceCode > a.sourceLine:before {
          display: none;
        }
      }
      :not(pre) > code {
        border-radius: 4px;
        background-color: var(--inline-code-bg);
        color: var(--fg);
        padding: 0.1em 0.35em;
        white-space: normal;
      }
      /* Syntax token colors (Pandoc) */
      .co {
        color: rgb(128, 147, 147);
        font-style: italic;
      }
      .ch,
      .st,
      .vs {
        color: rgb(236, 196, 141);
      }
      .va {
        color: rgb(214, 222, 235);
      }
      .dv,
      .bn,
      .fl {
        color: rgb(247, 140, 108);
      }
      .bu,
      .cn,
      .at,
      .fu,
      .dt {
        color: rgb(130, 170, 255);
      }
      .im,
      .op,
      .kw,
      .ot,
      .cf {
        color: #c693ea;
      }

      /* Media helpers */
      iframe {
        width: 100%;
      }
      .iframe--example {
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .pdf {
        margin: 1rem -6rem;
        height: 30rem;
        width: calc(100% + 12rem);
      }
      .pdf-link {
        display: none;
      }
      @media (max-width: 800px) {
        .pdf {
          margin: 1rem 0;
          width: 100%;
        }
      }
      @media (max-width: 667px) {
        .pdf {
          display: none;
        }
        .pdf-link {
          display: inline;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="dark min-h-dvh flex flex-col leading-[1.65]">
    <script>
      ;(() => {
        window.site = {
          theme:
            localStorage.getItem('theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'),
          setTheme: (name) => {
            document.body.classList.add(name === 'light' ? 'light' : 'dark')
            document.body.classList.remove(name === 'light' ? 'dark' : 'light')
            localStorage.setItem('theme', name)
            window.site.theme = name
            window.site.refreshThemeSwitch()
          },
          refreshThemeSwitch: () => {
            const isLight = window.site.theme === 'light'
            const themeSwitch = document.querySelector('[data-theme-switch]')

            themeSwitch?.setAttribute(
              'aria-label',
              isLight ? 'Switch to dark mode' : 'Switch to light mode'
            )
            themeSwitch?.setAttribute('aria-checked', isLight ? 'false' : 'true')
          },
        }

        window.site.setTheme(window.site.theme)
      })()
    </script>

    $body$

    <script async>
      ;(() => {
        window.site.refreshThemeSwitch()
        document.querySelector('[data-theme-switch]')?.addEventListener('click', () => {
          window.site.setTheme(window.site.theme === 'light' ? 'dark' : 'light')
        })

        // "copy" button on every code block
        document.querySelectorAll('div.sourceCode').forEach((block) => {
          const button = document.createElement('button')
          button.type = 'button'
          button.textContent = 'copy'
          button.setAttribute('data-copy', '')
          button.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(block.querySelector('pre').innerText)
              button.textContent = 'copied'
            } catch {
              button.textContent = 'error'
            }
            setTimeout(() => (button.textContent = 'copy'), 1500)
          })
          block.appendChild(button)
        })
      })()
    </script>
